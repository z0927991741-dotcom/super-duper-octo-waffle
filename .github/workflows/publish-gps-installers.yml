name: 發布 GPS 網頁同版雙平台測試包
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-gps-installers.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ff46810997a5d3d0023a78290e1fea656da3344f
      - uses: actions/checkout@v4
        with:
          ref: downloads-web-v0.19.0
          path: installer-base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 還原 APK 並建立同版 Windows
        run: |
          cat preview-builds/gps-v0.21.part-* > preview-builds/DreamMender-GPS-v0.21.apk
          cat installer-base/windows.part-* > installer-base/base.zip
          python scripts/repackage-gps-release.py installer-base/base.zip
      - name: 發布雙平台下載
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.21.0-gps-preview >/dev/null 2>&1 || gh release create v0.21.0-gps-preview --target 'ff46810997a5d3d0023a78290e1fea656da3344f' --prerelease --title '夢境修補員 GPS｜直線指引與道路行走測試版' --notes-file web-packaging/GPS-RELEASE.md
          gh release upload v0.21.0-gps-preview web-packaging/output/DreamMender-GPS-Windows-v0.21.zip web-packaging/output/DreamMender-GPS-v0.21.apk web-packaging/output/SHA256SUMS.txt web-packaging/output/GPS-RELEASE.md --clobber
