name: 發布 GPS 網頁同版雙平台測試包
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-gps-installers.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 54d4653afd8ee298809e353e07d9c24372d7a4d2
      - uses: actions/checkout@v4
        with:
          ref: downloads-web-v0.19.0
          path: installer-base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 還原 APK 並建立同版 Windows
        run: |
          cat preview-builds/gps-v0.23.part-* > preview-builds/DreamMender-GPS-v0.23.apk
          cat installer-base/windows.part-* > installer-base/base.zip
          python scripts/package-gps-v23.py --windows-base installer-base/base.zip
      - name: 發布雙平台下載
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.23.0-gps-preview >/dev/null 2>&1 || gh release create v0.23.0-gps-preview --target '54d4653afd8ee298809e353e07d9c24372d7a4d2' --prerelease --title '夢境修補員｜網頁 v23 同版 Windows ZIP／Android APK' --notes-file web-packaging/GPS-RELEASE.md
          gh release upload v0.23.0-gps-preview web-packaging/output/DreamMender-GPS-Windows-v0.23.zip web-packaging/output/DreamMender-GPS-v0.23.apk web-packaging/output/SHA256SUMS.txt web-packaging/output/GPS-RELEASE.md web-packaging/output/native-manifest.json --clobber
