name: 發布夢境修補員網站
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 建立無外部依賴的網站
        run: |
          npm run build:standalone
          cp dist/dream-mender.html dist/index.html
          touch dist/.nojekyll
      - name: 取得獨立 GPS 網頁測試版
        uses: actions/checkout@v4
        with:
          ref: 6e9a12edc4963a7cfb6d572387bdd9d6633025f4
          path: gps-preview
      - name: 建立 GPS 測試入口
        run: |
          (cd gps-preview && npm run build:standalone)
          mkdir -p dist/gps-test
          cp gps-preview/dist/dream-mender.html dist/gps-test/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 發布
        id: deployment
        uses: actions/deploy-pages@v4
